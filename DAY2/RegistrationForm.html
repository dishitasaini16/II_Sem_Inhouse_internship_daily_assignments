<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <form class="form"
        action="form.php"
        method="POST">

        <h2>Registration Form</h2>

        <div class="input-box">
            <label>Full Name</label>
            <input type="text" id="txtName"name="name" placeholder="Enter full name" required>
        </div>

        <div class="input-box">
            <label>Email Address</label>
            <input type="email" id="txtEmail" name="email" placeholder="Enter email address" required>
        </div>

        <div class="row">

            <div class="input-box">
                <label>Phone Number</label>
                <input type="text" id="txtphone" name="phone" placeholder="Enter phone number"required>
            </div>

            <div class="input-box">
                <label>Birth Date</label>
                <input type="date">
            </div>

        </div>

        <div class="gender-box">

            <label>Gender</label>

            <div class="gender-option">

                <div class="gender">
                    <input type="radio" id="male" name="gender" checked>
                    <label for="male">Male</label>
                </div>

                <div class="gender">
                    <input type="radio" id="female" name="gender">
                    <label for="female">Female</label>
                </div>

                <div class="gender">
                    <input type="radio" id="other" name="gender">
                    <label for="other">Prefer not to say</label>
                </div>

            </div>

        </div>

        <div class="input-box">
            <label>Address</label>
            <input type="text" placeholder="Enter street address">
            <input type="text" placeholder="Enter street address line 2">
        </div>

        <div class="row">

            <div class="input-box">

                <label>Country</label>

                <select>
                    <option>America</option>
                    <option>Japan</option>
                    <option>India</option>
                    <option>Nepal</option>
                </select>

            </div>

            <div class="input-box">
                <label>City</label>
                <input type="text" placeholder="Enter your city">
            </div>

        </div>

        <div class="row">

            <div class="input-box">
                <label>State</label>

                <select>
                    <option>Rajasthan</option>
                    <option>Delhi</option>
                    <option>Maharashtra</option>
                    <option>Punjab</option>
                </select>
            </div>

            <div class="input-box">
                <label>Postal Code</label>
                <input type="text" placeholder="Enter postal code">
            </div>

        </div>

        <button type="submit">Submit</button>

    </form>

</div>

</body>
</html>
