<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Details</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>
body{
    background:#3033d7;
}

.card{
    border-radius:15px;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.details{
    display:none;
}
</style>

</head>

<body>

<div class="container py-5">

<h2 class="text-center text-white fw-bold mb-4">Student Details</h2>

<div class="row justify-content-center mb-4">
    <div class="col-md-4">
        <input type="text" id="search" class="form-control" placeholder="Search Student">
    </div>
</div>

<div class="row" id="container"></div>

</div>

<script>

const students = [

{
name:"dishita",
course:"b.tech",
branch:"AI",
profession:"Web Developer",
cgpa:"9.5",
image:"images/dishita.jpeg"
},
{
name:"sita",
course:"BCA",
branch:"Computer Science",
profession:"UI/UX Designer",
cgpa:"9.6",
image:"images/sita.jpeg"
},

{
name:"avni",
course:"b.tech",
branch:"Information Technology",
profession:"Software Engineer",
cgpa:"9.0",
image:"images/avni.jpeg"
},




];

function display(data){

let html="";

for(let i=0;i<data.length;i++){

html += `
<div class="col-md-4 col-lg-3 mb-4">

<div class="card shadow text-center">

<img src="${data[i].image}">
  

<div class="card-body">

<h5>${data[i].name}</h5>

<p>${data[i].course}</p>

<button class="btn btn-success btn-sm viewBtn">
View Details
</button>

<div class="details mt-3">

<p><b>Branch :</b> ${data[i].branch}</p>

<p><b>Profession :</b> ${data[i].profession}</p>

<p><b>CGPA :</b> ${data[i].cgpa}</p>

</div>

</div>

</div>

</div>
`;

}

$("#container").html(html);

$(".viewBtn").click(function(){
$(this).next(".details").slideToggle();
});

}

display(students);

$("#search").on("keyup",function(){

let value = $(this).val().toLowerCase();

let result = students.filter(function(student){
    return student.name.toLowerCase().includes(value);
});

display(result);

});

</script>

</body>
</html>
